<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EFMI Vulkan</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="scene" aria-hidden="true">
  <svg class="lines" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".55" stop-color="#fff" stop-opacity=".5"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <g fill="none" stroke="url(#fade)" stroke-width="1">
      <path d="M-40 470 C 180 380, 330 520, 560 400 S 900 250, 1060 330"/>
      <path d="M-40 430 C 190 330, 340 470, 570 350 S 900 200, 1060 280"/>
      <path d="M-40 390 C 200 280, 350 420, 580 300 S 900 150, 1060 230"/>
      <path d="M-40 350 C 210 230, 360 370, 590 250 S 900 100, 1060 180"/>
      <path d="M-40 310 C 220 180, 370 320, 600 200 S 900 50, 1060 130"/>
      <path d="M-40 270 C 230 130, 380 270, 610 150 S 900 0, 1060 80"/>
      <path d="M-40 230 C 240 80, 390 220, 620 100 S 900 -50, 1060 30"/>
    </g>
  </svg>
  <div class="mark">
    <i></i><i></i><i></i>
  </div>
</div>

<header>
  <div class="brand"><b>EFMI</b><span>VULKAN</span></div>
  <button id="gear" class="icon" type="button">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<footer>
  <div id="version" class="version"></div>
  <button id="start" class="primary" type="button"><span id="start-text"></span></button>
</footer>

<div id="toast" class="toast"></div>

<div id="shade" class="shade"></div>
<aside id="drawer" class="drawer">
  <div class="drawer-head">
    <h2 data-text="settings"></h2>
    <button id="close" class="icon" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="row" data-key="game_path">
    <label data-text="game"></label>
    <div class="field"><span class="value"></span><button class="ghost" type="button"></button></div>
  </div>
  <div class="row" data-key="launcher_path">
    <label data-text="official"></label>
    <div class="field"><span class="value"></span><button class="ghost" type="button"></button></div>
  </div>
  <div class="row" data-key="efmi_path">
    <label data-text="efmi"></label>
    <div class="field"><span class="value"></span><button class="ghost" type="button"></button></div>
  </div>
  <div class="row" data-key="layer_path">
    <label data-text="layer"></label>
    <div class="field"><span class="value"></span><button class="ghost" type="button"></button></div>
    <div class="field second"><span id="layer-state" class="state"></span><button id="file" class="ghost" type="button" data-text="from_file"></button><button id="install" class="ghost" type="button"></button></div>
  </div>
</aside>

<script src="app.js"></script>
</body>
</html>
